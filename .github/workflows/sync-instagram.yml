name: Sync Instagram gallery

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Sync recent posts to Sanity
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
        run: |
          if [ -z "$INSTAGRAM_ACCESS_TOKEN" ] || [ -z "$SANITY_API_TOKEN" ]; then
            echo "Instagram sync is disabled until both repository secrets are configured."
            exit 0
          fi
          npm run instagram:sync
